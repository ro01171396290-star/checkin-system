services:
  - type: web
    name: lucky-shell-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lucky-shell-db
          property: connectionString

databases:
  - name: lucky-shell-db
    plan: free
