<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CheckIn</title>
<style>
:root {
  --primary: #6c5ce7;
  --primary-light: #a29bfe;
  --primary-dark: #5a4bd1;
  --bg-phone: #0f0f1a;
  --bg-card: #151525;
  --bg-nav: #1a1a2e;
  --bg-dark: #1e1e32;
  --gold: #f9ca24;
  --success: #00cec9;
  --phone-radius: 36px;
  --card-radius: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; font-family: 'Segoe UI', sans-serif;
}
.phone {
  width: 390px; min-height: 780px;
  background: var(--bg-phone);
  border-radius: var(--phone-radius);
  padding: 18px 16px 20px;
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.phone-bg {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background-size: cover; background-position: center;
  background-repeat: no-repeat;
  border-radius: var(--phone-radius); z-index: 0; pointer-events: none;
  opacity: 0.25;
}

/* Header */
.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 2px 8px;
}
.app-title {
  font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 1px;
}
.clock {
  font-size: 12px; color: #aaa; font-family: 'Courier New', monospace;
  text-align: right; line-height: 1.3;
}
.clock .time { font-size: 15px; color: #ddd; font-weight: 600; }
.clock .date { font-size: 11px; color: #777; }

/* Logout & User info */
.user-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 2px 4px;
}
.user-code {
  font-size: 11px; color: #555;
}
.logout-btn {
  background: none; border: 1px solid #2a2a42; color: #666;
  padding: 4px 12px; border-radius: 8px; font-size: 11px;
  cursor: pointer; transition: all 0.2s;
}
.logout-btn:hover { border-color: var(--primary); color: var(--primary-light); }

/* Day Counter */
.day-counter { text-align: center; padding: 4px 0; }
.day-label {
  font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 4px;
}
.day-number {
  font-size: 88px; font-weight: 800; line-height: 1.05;
  background: linear-gradient(180deg, #fff 0%, #aaa 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.day-sub { font-size: 13px; color: #666; margin-top: -4px; }

/* ======= 30-Day Grid ======= */
.grid-section {
  background: var(--bg-card); border-radius: 16px;
  padding: 14px 12px; margin: 12px 0;
}
.grid-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.grid-title {
  font-size: 13px; color: #777; text-transform: uppercase;
}
.grid-legend {
  display: flex; gap: 12px; font-size: 10px; color: #555; align-items: center;
}
.legend-dot {
  width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 4px;
}
.legend-dot.done { background: var(--primary); }
.legend-dot.pending { background: var(--bg-dark); border: 1px solid #333; }
.legend-dot.milestone { background: var(--bg-dark); border: 1.5px solid var(--gold); }

.day-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 6px;
}
.grid-day {
  aspect-ratio: 1;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  transition: all 0.3s;
  position: relative;
}
.grid-day.done {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: 0 2px 8px rgba(108,92,231,0.3);
}
.grid-day.pending {
  background: var(--bg-nav); color: #444;
  border: 1px solid #1f1f33;
}
.grid-day.milestone-marker {
  border: 1.5px solid var(--gold) !important;
}
.grid-day.today {
  border: 1.5px solid var(--primary-light) !important;
  animation: todayPulse 2s infinite;
}
@keyframes todayPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(162,155,254,0.3); }
  50% { box-shadow: 0 0 0 6px rgba(162,155,254,0); }
}
.grid-day .badge {
  position: absolute; top: -4px; right: -4px;
  font-size: 9px; line-height: 1;
}

/* ======= Progress bar ======= */
.progress-bar-bg {
  height: 6px; background: var(--bg-dark); border-radius: 3px;
  overflow: hidden; margin: 8px 0 12px;
}
.progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light));
  border-radius: 3px; transition: width 0.5s ease;
}

/* ======= Milestone cards ======= */
.milestone-cards {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  margin: 10px 0;
}
.ms-card {
  background: var(--bg-card); border-radius: var(--card-radius); padding: 12px 6px;
  text-align: center; transition: all 0.3s;
  border: 1.5px solid transparent;
}
.ms-card.achieved {
  background: #1a1530; border-color: var(--primary);
  box-shadow: 0 0 20px rgba(108,92,231,0.15);
}
.ms-card .ms-icon { width: 36px; height: 36px; object-fit: contain; margin-bottom: 4px; }
.ms-card .ms-day {
  font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 2px;
}
.ms-card .ms-reward { font-size: 10px; color: #555; }
.ms-card.achieved .ms-reward { color: var(--primary-light); }

/* ======= Check-in Button ======= */
.btn-area { text-align: center; padding: 10px 0 4px; }
.checkin-btn {
  width: 100px; height: 100px; border-radius: 50%;
  border: none; font-size: 16px; font-weight: 800;
  cursor: pointer; transition: all 0.3s;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff; box-shadow: 0 8px 30px rgba(108,92,231,0.4);
  letter-spacing: 1px;
}
.checkin-btn:hover { transform: scale(1.04); }
.checkin-btn:active { transform: scale(0.96); }
.checkin-btn.done {
  background: var(--bg-dark); color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary);
}
.status-msg {
  margin-top: 10px; font-size: 13px; font-weight: 600;
  min-height: 18px; transition: all 0.3s;
}
.status-msg.success { color: var(--success); }
.status-msg.already { color: var(--gold); }
.status-msg.broken { color: #e17055; }

/* ======= Reward Overlay ======= */
.overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7); display: flex;
  justify-content: center; align-items: center;
  z-index: 100; opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.overlay.show { opacity: 1; pointer-events: all; }
.reward-card {
  border-radius: 24px;
  padding: 12px 12px 20px;
  text-align: center; max-width: 340px; width: 88%;
  position: relative;
}
.reward-close {
  position: absolute; top: 8px; right: 12px;
  background: rgba(255,255,255,0.1); border: none;
  color: #aaa; font-size: 20px; width: 30px; height: 30px;
  border-radius: 50%; cursor: pointer; line-height: 1;
  transition: all 0.2s; z-index: 1;
}
.reward-close:hover { background: rgba(255,255,255,0.2); color: #fff; }
.reward-gif {
  width: 100%; border-radius: 12px; display: block;
}
.reward-claim {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff; border: none; padding: 14px 40px;
  border-radius: 30px; font-size: 16px; font-weight: 700;
  cursor: pointer; width: 100%;
}

/* ======= Daily GIF Popup ======= */
.daily-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.8); display: flex;
  justify-content: center; align-items: center;
  z-index: 100; opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.daily-overlay.show { opacity: 1; pointer-events: all; }
.daily-card {
  border-radius: 24px;
  padding: 12px 12px 20px;
  text-align: center; max-width: 340px; width: 88%;
  position: relative;
}
.daily-close {
  position: absolute; top: 8px; right: 12px;
  background: rgba(255,255,255,0.1); border: none;
  color: #aaa; font-size: 20px; width: 30px; height: 30px;
  border-radius: 50%; cursor: pointer; line-height: 1;
  transition: all 0.2s;
}
.daily-close:hover { background: rgba(255,255,255,0.2); color: #fff; }
.daily-gif {
  width: 100%; border-radius: 12px; display: block;
}
.daily-claim-text {
  margin-top: 12px; font-size: 15px; font-weight: 700;
  color: var(--gold); letter-spacing: 1px;
}

/* ======= Bottom Nav ======= */
.bottom-nav {
  display: flex; justify-content: space-around;
  padding: 12px 0; background: var(--bg-nav); border-radius: 20px;
  margin: 16px 0 0;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: #555; font-size: 10px;
}
.nav-item.active { color: var(--primary-light); }
.nav-icon { font-size: 18px; }

/* ======= Notice Banner ======= */
.notice-banner {
  background: linear-gradient(135deg, var(--gold), #f0932b);
  color: var(--bg-nav);
  padding: 10px 14px;
  border-radius: 10px;
  margin: 0 2px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
  position: relative;
  z-index: 1;
}
.notice-text { flex: 1; }
.notice-close {
  background: rgba(0,0,0,0.2);
  border: none;
  color: #1a1a2e;
  font-size: 18px;
  width: 24px; height: 24px;
  border-radius: 50%;
  cursor: pointer;
  line-height: 1;
  flex-shrink: 0;
}

/* ======= Maintenance Overlay ======= */
.maintenance-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15,15,26,0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 99;
  border-radius: 36px;
}
.maintenance-card { text-align: center; padding: 30px; }
.maintenance-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.6; color: #aaa; }
.maintenance-title { font-size: 22px; color: #f0f6fc; font-weight: 700; margin-bottom: 8px; }
.maintenance-desc { font-size: 14px; color: #8b949e; }
</style>
</head>
<body>

<div class="phone" id="app">
  <div class="phone-bg" id="phoneBg"></div>
  <!-- Tab: Rewards -->
  <div class="tab-page" id="tabRewards">
  <div class="header">
    <div class="app-title">CheckIn</div>
    <div class="clock">
      <div class="time" id="clockTime">--:--</div>
      <div class="date" id="clockDate">--/--/----</div>
    </div>
  </div>

  <div class="user-bar">
    <span class="user-code" id="userCode">--</span>
    <div>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <!-- Notice Banner -->
  <div class="notice-banner" id="noticeBanner" style="display:none">
    <span class="notice-text" id="noticeTextEl"></span>
    <button class="notice-close" onclick="document.getElementById('noticeBanner').style.display='none'">&times;</button>
  </div>

  <div class="day-counter">
    <div class="day-number" id="dayNum">0</div>
    <div class="day-sub" id="daySub">days</div>
  </div>

  <!-- 30-Day Grid -->
  <div class="grid-section">
    <div class="grid-header">
      <div class="grid-title" id="gridTitle">Daily Random RM8 ~ RM388</div>
      <div class="grid-legend">
        <span><span class="legend-dot done"></span> Done</span>
        <span><span class="legend-dot pending"></span> Open</span>
        <span><span class="legend-dot milestone"></span> Bonus</span>
      </div>
    </div>
    <div class="day-grid" id="dayGrid"></div>
  </div>

  <!-- Progress -->
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
  </div>

  <!-- Milestone Cards -->
  <div class="milestone-cards" id="milestoneCards"></div>

  <!-- Button -->
  <div class="btn-area">
    <button class="checkin-btn" id="checkinBtn" onclick="doCheckin()">CHECK IN</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>
  </div><!-- /tabRewards -->

  <!-- Tab: Slot Win Rate -->
  <div class="tab-page" id="tabSlot" style="display:none">
    <iframe id="slotFrame" src="slot.html" style="width:100%;height:100%;border:none;position:absolute;top:0;left:0;"></iframe>
  </div><!-- /tabSlot -->

  <div class="bottom-nav">
    <div class="nav-item active" id="navRewards" onclick="switchTab('rewards')"><span class="nav-icon">🎁</span>Rewards</div>
    <div class="nav-item" id="navSlot" onclick="switchTab('slot')"><span class="nav-icon">🎰</span>Slot Win Rate</div>
  </div>
</div>

<div class="overlay" id="rewardOverlay">
  <div class="reward-card">
    <button class="reward-close" onclick="claimReward()">&times;</button>
    <img class="reward-gif" id="rewardGif" src="" alt="Reward" />
    <div class="daily-claim-text">Pls Screenshot To Claim</div>
    <button class="reward-claim" onclick="claimReward()">CLAIM</button>
  </div>
</div>

<!-- Daily GIF Popup -->
<div class="daily-overlay" id="dailyOverlay">
  <div class="daily-card">
    <button class="daily-close" onclick="closeDailyPopup()">&times;</button>
    <img class="daily-gif" src="daily.gif" alt="Daily Reward" />
    <div class="daily-claim-text">Pls Screenshot To Claim</div>
  </div>
</div>

<!-- Maintenance Overlay -->
<div class="maintenance-overlay" id="maintenanceOverlay" style="display:none">
  <div class="maintenance-card">
    <div class="maintenance-icon">&#9881;</div>
    <div class="maintenance-title">Under Maintenance</div>
    <div class="maintenance-desc">We're making things better. Please check back later.</div>
  </div>
</div>

<script>
// ========== Auth ==========
const API_BASE = 'https://checkin-system-dok2.onrender.com';
let token, user;

// ========== Remote Settings ==========
let S = {
  appTitle: 'CheckIn', gridTitle: 'Daily Random RM8 ~ RM388',
  claimText: 'Pls Screenshot To Claim', comeBackText: 'Come back tomorrow for Day {day}!',
  tabRewards: 'Rewards', tabSlot: 'Slot Win Rate',
  rewardGifs: {7:'day7.gif',14:'day14.gif',21:'day21.gif',30:'day30.gif'},
  dailyGif: 'daily.gif', rewardBg: 'reward_bg.png',
  slotUrl: 'slot.html',
  loginPage: 'login_apk.html', registerPage: 'register_apk.html',
  themePrimary: '#6c5ce7', themePrimaryLight: '#a29bfe', themePrimaryDark: '#5a4bd1',
  themeBgPhone: '#0f0f1a', themeBgCard: '#151525', themeBgNav: '#1a1a2e',
  themeBgDark: '#1e1e32', themeGold: '#f9ca24', themeSuccess: '#00cec9',
  themeRadius: '36'
};

async function loadSettings() {
  try {
    const res = await fetch(API_BASE + '/api/settings');
    const data = await res.json();
    if (data.success && data.settings) {
      const s = data.settings;
      S.appTitle = s.appTitle || S.appTitle;
      S.gridTitle = s.gridTitle || S.gridTitle;
      S.claimText = s.claimText || S.claimText;
      S.comeBackText = s.comeBackText || S.comeBackText;
      S.tabRewards = s.tabRewards || S.tabRewards;
      S.tabSlot = s.tabSlot || S.tabSlot;
      S.rewardGifs = {
        7: s.rewardGifDay7 || 'day7.gif', 14: s.rewardGifDay14 || 'day14.gif',
        21: s.rewardGifDay21 || 'day21.gif', 30: s.rewardGifDay30 || 'day30.gif'
      };
      S.dailyGif = s.dailyGif || 'daily.gif';
      S.rewardBg = s.rewardBg || 'reward_bg.png';
      S.slotUrl = s.slotUrl || 'slot.html';
      S.loginPage = s.loginPage || 'login_apk.html';
      S.registerPage = s.registerPage || 'register_apk.html';
      S.noticeText = s.noticeText || '';
      S.noticeEnabled = s.noticeEnabled || 'false';
      S.maintenanceMode = s.maintenanceMode || 'false';
      // Theme
      S.themePrimary = s.themePrimary || S.themePrimary;
      S.themePrimaryLight = s.themePrimaryLight || S.themePrimaryLight;
      S.themePrimaryDark = s.themePrimaryDark || S.themePrimaryDark;
      S.themeBgPhone = s.themeBgPhone || S.themeBgPhone;
      S.themeBgCard = s.themeBgCard || S.themeBgCard;
      S.themeBgNav = s.themeBgNav || S.themeBgNav;
      S.themeBgDark = s.themeBgDark || S.themeBgDark;
      S.themeGold = s.themeGold || S.themeGold;
      S.themeSuccess = s.themeSuccess || S.themeSuccess;
      S.themeRadius = s.themeRadius || S.themeRadius;
    }
  } catch(e) { console.log('Settings load skipped, using defaults'); }
  applySettings();
}

function applySettings() {
  document.title = S.appTitle;
  var el = document.querySelector('.app-title'); if (el) el.textContent = S.appTitle;
  el = document.getElementById('gridTitle'); if (el) el.textContent = S.gridTitle;
  el = document.getElementById('navRewards'); if (el) el.innerHTML = '<span class="nav-icon">🎁</span>' + S.tabRewards;
  el = document.getElementById('navSlot'); if (el) el.innerHTML = '<span class="nav-icon">🎰</span>' + S.tabSlot;
  el = document.getElementById('slotFrame'); if (el) el.src = S.slotUrl;
  document.querySelectorAll('.daily-claim-text').forEach(function(e) { e.textContent = S.claimText; });
  el = document.querySelector('.daily-gif'); if (el) el.src = S.dailyGif;
  el = document.getElementById('phoneBg'); if (el && S.rewardBg) el.style.backgroundImage = "url('" + S.rewardBg + "')";
  // Fallback: also set on .phone directly for WebView compatibility
  var phone = document.querySelector('.phone');
  if (phone && S.rewardBg) {
    phone.style.backgroundImage = "url('" + S.rewardBg + "')";
    phone.style.backgroundSize = 'cover';
    phone.style.backgroundPosition = 'center';
    phone.style.backgroundRepeat = 'no-repeat';
  }

  // Notice banner
  var nb = document.getElementById('noticeBanner');
  var nt = document.getElementById('noticeTextEl');
  if (S.noticeEnabled === 'true' && S.noticeText) {
    if (nt) nt.textContent = S.noticeText;
    if (nb) nb.style.display = 'flex';
  } else {
    if (nb) nb.style.display = 'none';
  }

  // Maintenance mode
  var mo = document.getElementById('maintenanceOverlay');
  if (S.maintenanceMode === 'true') {
    if (mo) mo.style.display = 'flex';
  } else {
    if (mo) mo.style.display = 'none';
  }

  // Theme CSS variables
  var r = document.documentElement;
  r.style.setProperty('--primary', S.themePrimary);
  r.style.setProperty('--primary-light', S.themePrimaryLight);
  r.style.setProperty('--primary-dark', S.themePrimaryDark);
  r.style.setProperty('--bg-phone', S.themeBgPhone);
  r.style.setProperty('--bg-card', S.themeBgCard);
  r.style.setProperty('--bg-nav', S.themeBgNav);
  r.style.setProperty('--bg-dark', S.themeBgDark);
  r.style.setProperty('--gold', S.themeGold);
  r.style.setProperty('--success', S.themeSuccess);
  r.style.setProperty('--phone-radius', S.themeRadius + 'px');
  r.style.setProperty('--card-radius', Math.max(4, parseInt(S.themeRadius) - 22) + 'px');
}

function checkAuth() {
  token = localStorage.getItem('checkin_token');
  const userStr = localStorage.getItem('checkin_user');
  if (!token || !userStr) {
    window.location.href = S.loginPage;
    return false;
  }
  user = JSON.parse(userStr);
  document.getElementById('userCode').textContent = user.inviteCode || user.phone;
  return true;
}

function doLogout() {
  localStorage.removeItem('checkin_token');
  localStorage.removeItem('checkin_user');
  window.location.href = S.loginPage;
}

// ========== API ==========
async function apiGet(path) {
  const res = await fetch(API_BASE + path, {
    headers: { 'Authorization': 'Bearer ' + token }
  });
  return res.json();
}

async function apiPost(path, body) {
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify(body)
  });
  return res.json();
}

// ========== State ==========
let appState = {
  totalDays: 0,
  checkedToday: false,
  streakDay: 0,
  milestonesClaimed: { day7: 0, day14: 0, day21: 0, day30: 0 },
  history: [],
  lastDate: null
};

async function loadState() {
  try {
    const data = await apiGet('/api/checkin/status');
    if (!data.success) return;
    appState.totalDays = data.totalDays;
    appState.checkedToday = data.checkedToday;
    appState.streakDay = data.streakDay;
    appState.milestonesClaimed = data.milestonesClaimed;
    appState.history = data.history || [];
    appState.lastDate = data.lastDate;
  } catch (e) {
    console.error('Failed to load state:', e);
  }
  updateUI();
}

function isTodayChecked() {
  return appState.checkedToday;
}

// ========== Logic ==========
async function doCheckin() {
  try {
    const data = await apiPost('/api/checkin', {});
    if (data.error) {
      showStatus(data.error, 'already');
      return;
    }

    appState.checkedToday = data.checkedToday;
    appState.streakDay = data.streakDay;
    appState.totalDays = data.totalDays;
    appState.lastDate = new Date().toISOString().slice(0, 10);
    if (!appState.history.includes(appState.lastDate)) {
      appState.history.push(appState.lastDate);
    }

    if (data.newMilestone > 0) {
      appState.milestonesClaimed['day' + data.newMilestone] = 1;
      updateUI();
      showReward(data.newMilestone);
      return;
    }

    updateUI();
    document.getElementById('dailyOverlay').classList.add('show');
  } catch (e) {
    showStatus('Network error, please try again', 'broken');
  }
}

function closeDailyPopup() {
  document.getElementById('dailyOverlay').classList.remove('show');
  const displayDay = appState.totalDays === 0 ? 0 : ((appState.totalDays - 1) % 30) + 1;
  const nextDay = displayDay % 30 + 1;
  showStatus(S.comeBackText.replace('{day}', nextDay), 'success');
}

let currentRewardDay = 0;

function showReward(day) {
  currentRewardDay = day;
  document.getElementById('rewardGif').src = S.rewardGifs[day] || 'day'+day+'.gif';
  document.getElementById('rewardOverlay').classList.add('show');
}

function claimReward() {
  document.getElementById('rewardOverlay').classList.remove('show');
  const displayDay = appState.totalDays === 0 ? 0 : ((appState.totalDays - 1) % 30) + 1;
  const nextDay = displayDay % 30 + 1;
  showStatus(S.comeBackText.replace('{day}', nextDay), 'success');
}

function showStatus(msg, cls) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + cls;
  setTimeout(() => { el.textContent = ''; el.className = 'status-msg'; }, 3000);
}

// ========== UI ==========
function updateUI() {
  const streak = appState.streakDay;
  const totalDays = appState.totalDays;
  const displayDay = totalDays === 0 ? 0 : ((totalDays - 1) % 30) + 1;
  const milestoneDays = [7, 14, 21, 30];
  const icons = [S.rewardGifs[7], S.rewardGifs[14], S.rewardGifs[21], S.rewardGifs[30]];
  const labels = ['Day 7','Day 14','Day 21','Day 30'];

  document.getElementById('dayNum').textContent = displayDay;

  // Progress bar
  document.getElementById('progressBar').style.width = (displayDay / 30 * 100) + '%';

  // 30-Day Grid
  const grid = document.getElementById('dayGrid');
  grid.innerHTML = '';
  const lastDone = displayDay;

  for (let i = 1; i <= 30; i++) {
    const div = document.createElement('div');
    div.className = 'grid-day';
    div.textContent = i;

    if (i <= lastDone) {
      div.classList.add('done');
    } else {
      div.classList.add('pending');
    }

    if (milestoneDays.includes(i) && i > lastDone) {
      div.classList.add('milestone-marker');
    }

    if (i === lastDone + 1 && !isTodayChecked() && lastDone < 30) {
      div.classList.add('today');
    }
    if (i === lastDone && isTodayChecked() && lastDone > 0) {
      div.classList.add('today');
    }

    if (milestoneDays.includes(i)) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = appState.milestonesClaimed['day' + i] ? '✓' : '⭐';
      div.appendChild(badge);
    }

    grid.appendChild(div);
  }

  // Milestone cards
  const cardsContainer = document.getElementById('milestoneCards');
  cardsContainer.innerHTML = '';
  milestoneDays.forEach((m, idx) => {
    const card = document.createElement('div');
    card.className = 'ms-card';
    if (appState.milestonesClaimed['day' + m]) card.classList.add('achieved');

    const icon = document.createElement('img');
    icon.className = 'ms-icon';
    icon.src = icons[idx];
    icon.alt = labels[idx];

    const dayEl = document.createElement('div');
    dayEl.className = 'ms-day';
    dayEl.textContent = labels[idx];

    const reward = document.createElement('div');
    reward.className = 'ms-reward';
    reward.textContent = appState.milestonesClaimed['day' + m] ? '✓ Bonus' : 'Bonus';

    card.appendChild(icon);
    card.appendChild(dayEl);
    card.appendChild(reward);
    cardsContainer.appendChild(card);
  });

  // Check-in button
  const btn = document.getElementById('checkinBtn');
  if (isTodayChecked()) {
    btn.textContent = 'CHECKED';
    btn.className = 'checkin-btn done';
  } else {
    btn.textContent = 'CHECK IN';
    btn.className = 'checkin-btn';
  }
}

// ========== Init ==========
if (checkAuth()) {
  loadSettings().then(function() { loadState(); });
}

function switchTab(tab) {
  document.getElementById('tabRewards').style.display = tab === 'rewards' ? 'block' : 'none';
  document.getElementById('tabSlot').style.display = tab === 'slot' ? 'block' : 'none';
  document.getElementById('navRewards').classList.toggle('active', tab === 'rewards');
  document.getElementById('navSlot').classList.toggle('active', tab === 'slot');
}

function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const MM = String(now.getMonth() + 1).padStart(2, '0');
  const yyyy = now.getFullYear();
  document.getElementById('clockTime').textContent = hh + ':' + mm;
  document.getElementById('clockDate').textContent = dd + '/' + MM + '/' + yyyy;
}
updateClock();
setInterval(updateClock, 1000);
</script>
